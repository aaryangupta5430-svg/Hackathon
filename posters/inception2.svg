<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <!-- Background: Red -->
  <rect width="300" height="450" fill="#ff0000" stroke="#00ff00" stroke-width="8"/>
  
  <!-- Header: Green -->
  <rect x="10" y="10" width="280" height="35" fill="#00ff00"/>
  <text x="150" y="32" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="900" fill="#0000ff" text-anchor="middle">🌀 BWAAAAAAAH SOUNDTRACK 🌀</text>
  
  <!-- Title -->
  <text x="150" y="78" font-family="'Comic Sans MS', Impact, sans-serif" font-size="32" font-weight="bold" fill="#ffff00" text-anchor="middle" stroke="#0000ff" stroke-width="2">INCEPTION 2</text>
  <text x="150" y="106" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="bold" fill="#00ff00" text-anchor="middle">DEEP SLEEP (HEAVY SNORE)</text>
  
  <!-- Tagline Box: Blue -->
  <rect x="15" y="122" width="270" height="28" fill="#0000ff"/>
  <text x="150" y="141" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="bold" fill="#ffff00" text-anchor="middle">"WE NEED TO HIT SNOOZE 5 TIMES"</text>
  
  <!-- Folded Paris City / Perspective Maze (Magenta, Yellow, Blue) -->
  <g transform="translate(150, 240)">
    <!-- Buildings bending into each other -->
    <polygon points="-120,60 -60,60 -60,-20 -120,20" fill="#ff00ff" stroke="#ffff00" stroke-width="3"/>
    <polygon points="120,60 60,60 60,-20 120,20" fill="#ff00ff" stroke="#ffff00" stroke-width="3"/>
    
    <!-- Upside-down buildings -->
    <polygon points="-80,-60 -20,-60 -20,-10 -80,-30" fill="#0000ff" stroke="#00ff00" stroke-width="3"/>
    <polygon points="80,-60 20,-60 20,-10 80,-30" fill="#0000ff" stroke="#00ff00" stroke-width="3"/>
    
    <!-- Spinning Top in Center (Yellow, Green, Red) -->
    <!-- Top peg -->
    <rect x="-4" y="-30" width="8" height="25" fill="#ffff00" stroke="#0000ff" stroke-width="2"/>
    <!-- Top disc -->
    <ellipse cx="0" cy="-5" rx="36" ry="12" fill="#00ff00" stroke="#0000ff" stroke-width="3"/>
    <!-- Top cone pointing down -->
    <polygon points="-36,-5 36,-5 0,40" fill="#ffff00" stroke="#0000ff" stroke-width="3"/>
    <circle cx="0" cy="42" r="3" fill="#ff00ff"/>
    
    <!-- Wobble lines -->
    <path d="M -45,-5 Q -55,0 -40,10" fill="none" stroke="#ffff00" stroke-width="3"/>
    <path d="M 45,-5 Q 55,0 40,10" fill="none" stroke="#ffff00" stroke-width="3"/>
    
    <!-- ZZZ Sleeping letters -->
    <text x="-70" y="-10" font-family="'Comic Sans MS', cursive" font-size="20" font-weight="bold" fill="#ffff00">Z</text>
    <text x="-85" y="-30" font-family="'Comic Sans MS', cursive" font-size="26" font-weight="bold" fill="#00ff00">Z</text>
    <text x="-105" y="-55" font-family="'Comic Sans MS', cursive" font-size="32" font-weight="bold" fill="#ffff00">Z</text>
  </g>
  
  <text x="150" y="340" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="bold" fill="#ffff00" text-anchor="middle">LEONARDO STILL SLEEPING ON A PLANE</text>
  
  <!-- Buttons -->
  <rect x="20" y="365" width="120" height="40" fill="#0000ff" stroke="#ffff00" stroke-width="3"/>
  <text x="80" y="390" font-family="'Comic Sans MS', cursive" font-size="15" font-weight="900" fill="#ffff00" text-anchor="middle">RENT: $99</text>
  
  <rect x="160" y="365" width="120" height="40" fill="#00ff00" stroke="#0000ff" stroke-width="3"/>
  <text x="220" y="390" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="900" fill="#ff0000" text-anchor="middle">DREAM: 500%</text>
  
  <text x="150" y="430" font-family="'Comic Sans MS', cursive" font-size="10" fill="#ffff00" text-anchor="middle">CHRISTOPHER NOLAN FORGOT THE PLOT</text>
</svg>
