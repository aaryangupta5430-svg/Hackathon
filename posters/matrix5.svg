<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <!-- Background: Blue -->
  <rect width="300" height="450" fill="#0000ff" stroke="#ff00ff" stroke-width="8"/>
  
  <!-- Digital Matrix Rain (Green code characters) -->
  <g font-family="monospace" font-size="12" font-weight="bold" fill="#00ff00" opacity="0.6">
    <text x="20" y="30">0 1 1 0 1</text>
    <text x="20" y="60">1 0 0 1 0</text>
    <text x="20" y="90">0 1 1 1 0</text>
    <text x="60" y="40">1 0 1 0 1</text>
    <text x="60" y="70">0 1 0 0 1</text>
    <text x="60" y="100">1 1 0 1 0</text>
    <text x="240" y="30">1 1 0 0 1</text>
    <text x="240" y="60">0 1 0 1 1</text>
    <text x="240" y="90">1 0 1 1 0</text>
    <text x="270" y="45">0 0 1 0 1</text>
    <text x="270" y="75">1 1 0 1 0</text>
  </g>
  
  <!-- Header: Red -->
  <rect x="10" y="10" width="280" height="35" fill="#ff0000"/>
  <text x="150" y="32" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="900" fill="#ffff00" text-anchor="middle">💻 SYSTEM32 WAS DELETED 💻</text>
  
  <!-- Title -->
  <text x="150" y="78" font-family="'Comic Sans MS', Impact, sans-serif" font-size="32" font-weight="bold" fill="#00ff00" text-anchor="middle" stroke="#ffff00" stroke-width="2">THE MATRIX 5</text>
  <text x="150" y="106" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="bold" fill="#ff00ff" text-anchor="middle">REBOOT AGAIN (SP3)</text>
  
  <!-- Tagline Box: Yellow -->
  <rect x="15" y="122" width="270" height="28" fill="#ffff00"/>
  <text x="150" y="141" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="bold" fill="#0000ff" text-anchor="middle">"TAKE THE BLUE SCREEN OF DEATH"</text>
  
  <!-- Neo Dodging Bullets / Modems (Magenta & Green & Yellow) -->
  <g transform="translate(150, 240)">
    <!-- Neo figure leaning backwards (Magenta coat) -->
    <path d="M -20,60 L -15,10 L 15,10 L 25,60 Z" fill="#ff00ff" stroke="#ffff00" stroke-width="3"/>
    <!-- Head leaning back -->
    <circle cx="20" cy="-10" r="18" fill="#ffff00" stroke="#ff0000" stroke-width="3"/>
    <!-- Sunglasses (Red) -->
    <ellipse cx="25" cy="-12" rx="8" ry="4" fill="#ff0000"/>
    
    <!-- Red & Blue Pills in hand -->
    <ellipse cx="-40" cy="15" rx="10" ry="5" fill="#ff0000" transform="rotate(-30 -40 15)"/>
    <ellipse cx="-20" cy="22" rx="10" ry="5" fill="#00ff00" transform="rotate(30 -20 22)"/>
    
    <!-- Flying Floppy Disks / Bullets -->
    <rect x="-80" y="-30" width="24" height="24" fill="#ffff00" stroke="#00ff00" stroke-width="2"/>
    <line x1="-50" y1="-18" x2="0" y2="-18" stroke="#ffff00" stroke-width="3" stroke-dasharray="4,4"/>
    
    <rect x="60" y="-45" width="24" height="24" fill="#00ff00" stroke="#ff00ff" stroke-width="2"/>
    <line x1="50" y1="-33" x2="10" y2="-20" stroke="#00ff00" stroke-width="3" stroke-dasharray="4,4"/>
  </g>
  
  <text x="150" y="340" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="bold" fill="#ffff00" text-anchor="middle">KEANU REEVES DOES NOT AGREE TO THIS</text>
  
  <!-- Buttons -->
  <rect x="20" y="365" width="120" height="40" fill="#00ff00" stroke="#ff0000" stroke-width="3"/>
  <text x="80" y="390" font-family="'Comic Sans MS', cursive" font-size="15" font-weight="900" fill="#0000ff" text-anchor="middle">RENT: $99</text>
  
  <rect x="160" y="365" width="120" height="40" fill="#ff00ff" stroke="#ffff00" stroke-width="3"/>
  <text x="220" y="390" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="900" fill="#ffff00" text-anchor="middle">MODEM 56K</text>
  
  <text x="150" y="430" font-family="'Comic Sans MS', cursive" font-size="10" fill="#00ff00" text-anchor="middle">PLEASE INSERT FLOPPY DISK 2 OF 493</text>
</svg>
