<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <!-- Background: Green -->
  <rect width="300" height="450" fill="#00ff00" stroke="#ff0000" stroke-width="8"/>
  
  <!-- CAM RIP Watermark diagonal -->
  <text x="150" y="230" font-family="Impact, sans-serif" font-size="38" fill="#ff0000" opacity="0.35" text-anchor="middle" transform="rotate(-30 150 230)">LEAKED CAM-RIP</text>
  
  <!-- Header: Blue -->
  <rect x="10" y="10" width="280" height="35" fill="#0000ff"/>
  <text x="150" y="32" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="900" fill="#ffff00" text-anchor="middle">☠️ 100% ILLEGAL DOWNLOAD ☠️</text>
  
  <!-- Title -->
  <text x="150" y="80" font-family="'Comic Sans MS', Impact, sans-serif" font-size="38" font-weight="bold" fill="#ff00ff" text-anchor="middle" stroke="#0000ff" stroke-width="2">SHREK 5</text>
  <text x="150" y="108" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="bold" fill="#ff0000" text-anchor="middle">THE ONION RECKONING</text>
  
  <!-- Tagline Box: Yellow -->
  <rect x="15" y="122" width="270" height="28" fill="#ffff00"/>
  <text x="150" y="141" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="bold" fill="#0000ff" text-anchor="middle">"GET OUT OF MY 16K SWAMP!"</text>
  
  <!-- Shrek Graphic Face (Yellow & Red & Blue) -->
  <g transform="translate(150, 240)">
    <!-- Ears (Trumpets) -->
    <path d="M -50,-50 L -85,-75 L -75,-85 L -45,-55 Z" fill="#ffff00" stroke="#0000ff" stroke-width="3"/>
    <ellipse cx="-80" cy="-80" rx="10" ry="6" fill="#ff00ff" transform="rotate(-40 -80 -80)"/>
    
    <path d="M 50,-50 L 85,-75 L 75,-85 L 45,-55 Z" fill="#ffff00" stroke="#0000ff" stroke-width="3"/>
    <ellipse cx="80" cy="-80" rx="10" ry="6" fill="#ff00ff" transform="rotate(40 80 -80)"/>
    
    <!-- Big Face -->
    <ellipse cx="0" cy="0" rx="60" ry="50" fill="#ffff00" stroke="#0000ff" stroke-width="5"/>
    
    <!-- Eyes -->
    <circle cx="-25" cy="-12" r="10" fill="#0000ff"/>
    <circle cx="-23" cy="-14" r="3" fill="#ffff00"/>
    <circle cx="25" cy="-12" r="10" fill="#0000ff"/>
    <circle cx="27" cy="-14" r="3" fill="#ffff00"/>
    
    <!-- Big Nose -->
    <ellipse cx="0" cy="8" rx="15" ry="10" fill="#ff00ff" stroke="#0000ff" stroke-width="2"/>
    <circle cx="-5" cy="10" r="3" fill="#ff0000"/>
    <circle cx="5" cy="10" r="3" fill="#ff0000"/>
    
    <!-- Grin -->
    <path d="M -30,25 Q 0,45 30,25" fill="none" stroke="#ff0000" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Brown vest replaced by Magenta vest -->
    <path d="M -55,42 L -65,70 L 65,70 L 55,42 Z" fill="#ff00ff" stroke="#0000ff" stroke-width="3"/>
  </g>
  
  <text x="150" y="340" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="bold" fill="#0000ff" text-anchor="middle">SUBTITLES: MANDARIN (HARDCODED)</text>
  
  <!-- Buttons -->
  <rect x="20" y="365" width="120" height="40" fill="#ff0000" stroke="#ffff00" stroke-width="3"/>
  <text x="80" y="390" font-family="'Comic Sans MS', cursive" font-size="15" font-weight="900" fill="#ffff00" text-anchor="middle">RENT: $99</text>
  
  <rect x="160" y="365" width="120" height="40" fill="#0000ff" stroke="#ffff00" stroke-width="3"/>
  <text x="220" y="390" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="900" fill="#ffff00" text-anchor="middle">AUDIO: MOSCOW CINEMA</text>
  
  <text x="150" y="430" font-family="'Comic Sans MS', cursive" font-size="10" fill="#ff0000" text-anchor="middle">SOMEONE COUGHS EVERY 12 SECONDS</text>
</svg>
