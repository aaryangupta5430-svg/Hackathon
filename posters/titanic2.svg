<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <!-- Background: Blue -->
  <rect width="300" height="450" fill="#0000ff" stroke="#ffff00" stroke-width="8"/>
  
  <!-- Red Warning Banner -->
  <rect x="10" y="10" width="280" height="35" fill="#ff0000"/>
  <text x="150" y="32" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="900" fill="#ffff00" text-anchor="middle">⚠️ EXCLUSIVE PREMIERE ⚠️</text>
  
  <!-- Main Title -->
  <text x="150" y="80" font-family="'Comic Sans MS', Impact, sans-serif" font-size="34" font-weight="bold" fill="#ff00ff" text-anchor="middle" stroke="#ffff00" stroke-width="2">TITANIC 2</text>
  <text x="150" y="110" font-family="'Comic Sans MS', cursive" font-size="20" font-weight="bold" fill="#00ff00" text-anchor="middle">THE REVENGE</text>
  
  <!-- Ocean Waves -->
  <path d="M 10,280 Q 80,260 150,280 T 290,280 L 290,400 L 10,400 Z" fill="#ff00ff" opacity="0.6"/>
  <path d="M 10,310 Q 80,290 150,310 T 290,310 L 290,400 L 10,400 Z" fill="#00ff00" opacity="0.4"/>
  
  <!-- Ship Silhouette -->
  <!-- Hull -->
  <polygon points="40,290 70,350 240,350 270,290" fill="#ffff00" stroke="#ff0000" stroke-width="4"/>
  <!-- Funnels -->
  <rect x="90" y="230" width="18" height="60" fill="#ff0000" stroke="#00ff00" stroke-width="3"/>
  <rect x="125" y="230" width="18" height="60" fill="#ff0000" stroke="#00ff00" stroke-width="3"/>
  <rect x="160" y="230" width="18" height="60" fill="#ff0000" stroke="#00ff00" stroke-width="3"/>
  <rect x="195" y="230" width="18" height="60" fill="#ff0000" stroke="#00ff00" stroke-width="3"/>
  <!-- Rocket Fire from back -->
  <polygon points="40,300 10,290 30,320 0,330 45,335" fill="#ff0000"/>
  <polygon points="35,305 15,300 28,318 8,325 40,330" fill="#ffff00"/>
  
  <!-- Angry Iceberg -->
  <polygon points="200,320 230,210 260,240 285,190 295,330" fill="#00ff00" stroke="#ff00ff" stroke-width="4"/>
  <!-- Iceberg Angry Eyes -->
  <circle cx="240" cy="245" r="6" fill="#ff0000"/>
  <circle cx="265" cy="235" r="6" fill="#ff0000"/>
  <!-- Boxing Glove on Iceberg -->
  <circle cx="185" cy="250" r="16" fill="#ff0000" stroke="#ffff00" stroke-width="3"/>
  <rect x="185" y="244" width="20" height="12" fill="#ff0000"/>
  
  <!-- Tagline -->
  <rect x="15" y="130" width="270" height="30" fill="#ffff00"/>
  <text x="150" y="151" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="bold" fill="#ff0000" text-anchor="middle">"THIS TIME... THE ICEBERG PAYS!"</text>
  
  <!-- Rating and Rent Badge -->
  <rect x="20" y="370" width="120" height="40" fill="#ff0000" stroke="#ffff00" stroke-width="3"/>
  <text x="80" y="395" font-family="'Comic Sans MS', cursive" font-size="15" font-weight="900" fill="#ffff00" text-anchor="middle">RENT: $99</text>
  
  <rect x="160" y="370" width="120" height="40" fill="#00ff00" stroke="#ff00ff" stroke-width="3"/>
  <text x="220" y="395" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="900" fill="#0000ff" text-anchor="middle">⭐ 0.001 / 10</text>
  
  <!-- Footer Disclaimer -->
  <text x="150" y="435" font-family="'Comic Sans MS', cursive" font-size="10" fill="#ffff00" text-anchor="middle">RECORDED IN 144p WITH NOKIA 3310</text>
</svg>
