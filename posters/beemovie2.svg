<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <!-- Background: Yellow -->
  <rect width="300" height="450" fill="#ffff00" stroke="#ff0000" stroke-width="8"/>
  
  <!-- Header: Blue -->
  <rect x="10" y="10" width="280" height="35" fill="#0000ff"/>
  <text x="150" y="32" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="900" fill="#ffff00" text-anchor="middle">🐝 YA LIKE JAZZ 2? 🐝</text>
  
  <!-- Title -->
  <text x="150" y="78" font-family="'Comic Sans MS', Impact, sans-serif" font-size="34" font-weight="bold" fill="#ff0000" text-anchor="middle" stroke="#0000ff" stroke-width="2">BEE MOVIE 2</text>
  <text x="150" y="106" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="bold" fill="#0000ff" text-anchor="middle">THE STINGING</text>
  
  <!-- Tagline Box: Green -->
  <rect x="15" y="122" width="270" height="28" fill="#00ff00"/>
  <text x="150" y="141" font-family="'Comic Sans MS', cursive" font-size="11" font-weight="bold" fill="#ff0000" text-anchor="middle">"HE IS SUING THE ENTIRE HUMAN RACE AGAIN"</text>
  
  <!-- Honeycomb Hexagons & Angry Bee -->
  <g transform="translate(150, 240)">
    <!-- Hexagons in Magenta & Blue -->
    <polygon points="-70,-60 -40,-75 -10,-60 -10,-30 -40,-15 -70,-30" fill="none" stroke="#ff00ff" stroke-width="4"/>
    <polygon points="10,-60 40,-75 70,-60 70,-30 40,-15 10,-30" fill="none" stroke="#ff00ff" stroke-width="4"/>
    <polygon points="-40,-15 -10,-30 20,-15 20,15 -10,30 -40,15" fill="none" stroke="#0000ff" stroke-width="4"/>
    
    <!-- Bee Wings (Green) -->
    <ellipse cx="-35" cy="-25" rx="35" ry="18" fill="#00ff00" opacity="0.8" transform="rotate(-30 -35 -25)" stroke="#0000ff" stroke-width="2"/>
    <ellipse cx="35" cy="-25" rx="35" ry="18" fill="#00ff00" opacity="0.8" transform="rotate(30 35 -25)" stroke="#0000ff" stroke-width="2"/>
    
    <!-- Bee Body Striped (Red & Blue) -->
    <ellipse cx="0" cy="10" rx="38" ry="48" fill="#ff0000" stroke="#0000ff" stroke-width="4"/>
    <path d="M -34, -5 L 34, -5" stroke="#0000ff" stroke-width="12"/>
    <path d="M -36, 20 L 36, 20" stroke="#0000ff" stroke-width="12"/>
    <polygon points="0,58 -8,78 8,78" fill="#ff00ff" stroke="#0000ff" stroke-width="2"/> <!-- Stinger -->
    
    <!-- Bee Head with Sunglasses -->
    <circle cx="0" cy="-35" r="24" fill="#0000ff"/>
    <!-- Sunglasses (Magenta) -->
    <rect x="-18" y="-42" width="16" height="12" rx="4" fill="#ff00ff"/>
    <rect x="2" y="-42" width="16" height="12" rx="4" fill="#ff00ff"/>
    <line x1="-2" y1="-38" x2="2" y2="-38" stroke="#ff00ff" stroke-width="3"/>
    
    <!-- Antennae -->
    <path d="M -8,-58 Q -20,-75 -30,-65" fill="none" stroke="#ff0000" stroke-width="4"/>
    <path d="M 8,-58 Q 20,-75 30,-65" fill="none" stroke="#ff0000" stroke-width="4"/>
  </g>
  
  <text x="150" y="340" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="bold" fill="#ff0000" text-anchor="middle">JERRY SEINFELD TALKS FOR 2 HOURS</text>
  
  <!-- Buttons -->
  <rect x="20" y="365" width="120" height="40" fill="#0000ff" stroke="#ff0000" stroke-width="3"/>
  <text x="80" y="390" font-family="'Comic Sans MS', cursive" font-size="15" font-weight="900" fill="#ffff00" text-anchor="middle">RENT: $99</text>
  
  <rect x="160" y="365" width="120" height="40" fill="#ff0000" stroke="#00ff00" stroke-width="3"/>
  <text x="220" y="390" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="900" fill="#ffff00" text-anchor="middle">HONEY 100%</text>
  
  <text x="150" y="430" font-family="'Comic Sans MS', cursive" font-size="10" fill="#0000ff" text-anchor="middle">UNAUTHORIZED COURTROOM DRAMA</text>
</svg>
