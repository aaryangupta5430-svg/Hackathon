<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <!-- Background: Magenta -->
  <rect width="300" height="450" fill="#ff00ff" stroke="#00ff00" stroke-width="8"/>
  
  <!-- Header Banner: Green -->
  <rect x="10" y="10" width="280" height="35" fill="#00ff00"/>
  <text x="150" y="32" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="900" fill="#ff0000" text-anchor="middle">🔥 IN THEATERS & SPACE 🔥</text>
  
  <!-- Title -->
  <text x="150" y="78" font-family="'Comic Sans MS', Impact, sans-serif" font-size="28" font-weight="900" fill="#ffff00" text-anchor="middle" stroke="#0000ff" stroke-width="2">FAST &amp; FURIOUS 87</text>
  <text x="150" y="105" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="bold" fill="#0000ff" text-anchor="middle">MISSION: ANDROMEDA</text>
  
  <!-- Tagline Box: Red -->
  <rect x="15" y="120" width="270" height="28" fill="#ff0000"/>
  <text x="150" y="139" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="bold" fill="#ffff00" text-anchor="middle">"ONE LAST RIDE... PART 87"</text>
  
  <!-- Space & Saturn Rings (Yellow & Blue) -->
  <ellipse cx="150" cy="240" rx="120" ry="25" fill="none" stroke="#ffff00" stroke-width="8"/>
  <ellipse cx="150" cy="240" rx="90" ry="18" fill="none" stroke="#00ff00" stroke-width="4"/>
  <circle cx="150" cy="240" r="45" fill="#0000ff" stroke="#ff0000" stroke-width="4"/>
  
  <!-- Muscle Car flying diagonally -->
  <g transform="translate(60, 200) rotate(-18)">
    <!-- Car body (Red) -->
    <rect x="0" y="20" width="130" height="35" fill="#ff0000" stroke="#ffff00" stroke-width="3"/>
    <!-- Car cabin -->
    <polygon points="30,20 50,0 95,0 110,20" fill="#ffff00" stroke="#0000ff" stroke-width="3"/>
    <!-- Wheels -->
    <circle cx="25" cy="55" r="16" fill="#0000ff" stroke="#ffff00" stroke-width="4"/>
    <circle cx="105" cy="55" r="16" fill="#0000ff" stroke="#ffff00" stroke-width="4"/>
    <!-- Exhaust Nitro Fire -->
    <polygon points="-5,28 -35,15 -20,33 -40,38 -15,42 -5,38" fill="#00ff00"/>
    <polygon points="-5,30 -25,20 -15,33 -30,36 -10,39 -5,36" fill="#ffff00"/>
  </g>
  
  <!-- Subtitle -->
  <text x="150" y="340" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="bold" fill="#ffff00" text-anchor="middle">STARRING: VIN DIESEL'S CLONE</text>
  
  <!-- Badges -->
  <rect x="20" y="365" width="120" height="40" fill="#0000ff" stroke="#ffff00" stroke-width="3"/>
  <text x="80" y="390" font-family="'Comic Sans MS', cursive" font-size="15" font-weight="900" fill="#ffff00" text-anchor="middle">RENT: $99</text>
  
  <rect x="160" y="365" width="120" height="40" fill="#ffff00" stroke="#ff0000" stroke-width="3"/>
  <text x="220" y="390" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="900" fill="#ff0000" text-anchor="middle">NOS 5000%</text>
  
  <text x="150" y="430" font-family="'Comic Sans MS', cursive" font-size="10" fill="#00ff00" text-anchor="middle">GEAR SHIFTED 942 TIMES PER MINUTE</text>
</svg>
