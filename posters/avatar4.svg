<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <!-- Background: Blue -->
  <rect width="300" height="450" fill="#0000ff" stroke="#ffff00" stroke-width="8"/>
  
  <!-- Header: Red -->
  <rect x="10" y="10" width="280" height="35" fill="#ff0000"/>
  <text x="150" y="32" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="900" fill="#ffff00" text-anchor="middle">🌱 DIRECTED BY JAMES CAMERON'S AI 🌱</text>
  
  <!-- Title -->
  <text x="150" y="78" font-family="'Comic Sans MS', Impact, sans-serif" font-size="34" font-weight="bold" fill="#00ff00" text-anchor="middle" stroke="#ff00ff" stroke-width="2">AVATAR 4</text>
  <text x="150" y="106" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="bold" fill="#ffff00" text-anchor="middle">THE PATH OF SOIL</text>
  
  <!-- Tagline Box: Magenta -->
  <rect x="15" y="122" width="270" height="28" fill="#ff00ff"/>
  <text x="150" y="141" font-family="'Comic Sans MS', cursive" font-size="12" font-weight="bold" fill="#ffff00" text-anchor="middle">"AFTER WATER... COMES DIRT"</text>
  
  <!-- Alien Tree & Na'vi with Shovel -->
  <g transform="translate(150, 240)">
    <!-- Soil mound (Red & Yellow) -->
    <ellipse cx="0" cy="70" rx="90" ry="25" fill="#ff0000" stroke="#ffff00" stroke-width="3"/>
    
    <!-- Giant Bioluminescent Mushroom/Plant (Green & Magenta) -->
    <path d="M -30,65 Q -10,0 -40,-40 Q 0,-70 40,-40 Q 10,0 30,65 Z" fill="#00ff00" stroke="#ff00ff" stroke-width="4"/>
    <ellipse cx="0" cy="-45" rx="55" ry="22" fill="#ff00ff" stroke="#ffff00" stroke-width="3"/>
    <circle cx="-25" cy="-48" r="6" fill="#ffff00"/>
    <circle cx="0" cy="-52" r="8" fill="#ffff00"/>
    <circle cx="25" cy="-48" r="6" fill="#ffff00"/>
    
    <!-- Shovel stuck in soil -->
    <line x1="-50" y1="70" x2="-75" y2="-10" stroke="#ffff00" stroke-width="6"/>
    <rect x="-83" y="-25" width="16" height="15" fill="#ff00ff" stroke="#ffff00" stroke-width="2"/>
    <polygon points="-58,60 -42,75 -35,55" fill="#00ff00"/>
    
    <!-- Glow dots -->
    <circle cx="-80" cy="20" r="4" fill="#ffff00"/>
    <circle cx="80" cy="10" r="4" fill="#ffff00"/>
    <circle cx="60" cy="-30" r="3" fill="#00ff00"/>
    <circle cx="-65" cy="-20" r="3" fill="#ff00ff"/>
  </g>
  
  <text x="150" y="340" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="bold" fill="#00ff00" text-anchor="middle">RUNTIME: 6 HOURS 45 MINUTES</text>
  
  <!-- Buttons -->
  <rect x="20" y="365" width="120" height="40" fill="#00ff00" stroke="#ff00ff" stroke-width="3"/>
  <text x="80" y="390" font-family="'Comic Sans MS', cursive" font-size="15" font-weight="900" fill="#0000ff" text-anchor="middle">RENT: $99</text>
  
  <rect x="160" y="365" width="120" height="40" fill="#ff00ff" stroke="#ffff00" stroke-width="3"/>
  <text x="220" y="390" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="900" fill="#ffff00" text-anchor="middle">IMAX 32K DIRT</text>
  
  <text x="150" y="430" font-family="'Comic Sans MS', cursive" font-size="10" fill="#ffff00" text-anchor="middle">PANDORA FARMING SIMULATOR</text>
</svg>
